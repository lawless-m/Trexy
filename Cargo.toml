[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lawless-m/Trexy"

[workspace.dependencies]
# Workspace members (ARCHITECTURE.md §7)
beam-trace = { path = "crates/beam-trace" }
tube-renderer = { path = "crates/tube-renderer" }
beam-sources = { path = "crates/beam-sources" }
beam-rasteriser = { path = "crates/beam-rasteriser" }
m6809 = { path = "crates/m6809" }

# Graphics. Native Linux only, Vulkan primary, WGSL against the WebGPU feature
# set. No WebGL2 path anywhere (ARCHITECTURE.md §7), hence egui-wgpu's default
# features — which pull wgpu/webgl and wgpu/metal — are off; wgpu's own default
# features below supply the native backends.
wgpu = "30.0"
winit = "0.30"
egui = "0.36"
egui-wgpu = { version = "0.36", default-features = false, features = [
    "winit",
    "x11",
    "wayland",
] }
egui-winit = "0.36"

# WGSL is validated CPU-side before it ever reaches the device, so a bad edit
# during hot-reload costs an error message rather than a device loss.
naga = { version = "30.0", features = ["wgsl-in"] }
notify = "8.2"
pollster = "1.0"

# Oscilloscope-music playback: hound decodes the WAV, cpal owns the clock the
# beam is slaved to.
cpal = "0.18"
hound = "3.5"

bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
toml = "1.1"

# The emulator's tests run millions of machine cycles each. Unoptimised that
# is minutes; optimised it is seconds, and a gate nobody waits for is a gate
# nobody runs.
[profile.test.package.m6809]
opt-level = 2

[profile.test.package.beam-rasteriser]
opt-level = 2
